<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img"><rect width="1400" height="760" fill="#fffaf8"/><rect x="0" y="0" width="1400" height="12" fill="#ff2442"/><circle cx="1320" cy="76" r="115" fill="#fff0f2"/><circle cx="95" cy="696" r="130" fill="#fff0f2"/><text x="92" y="85" fill="#d91634" font-size="22" font-weight="800" font-family="Microsoft YaHei, sans-serif">马哥赢创 · 实战知识图</text><text x="92" y="166" fill="#1d2025" font-size="54" font-weight="900" font-family="Microsoft YaHei, sans-serif">参考值不是答案，是诊断起点</text><text x="94" y="217" fill="#687077" font-size="25" font-family="Microsoft YaHei, sans-serif">先用案例线建立手感，再用自己同任务的历史数据替换</text><rect x="92" y="290" width="284" height="274" rx="24" fill="#ffffff" stroke="#f1d4d8" stroke-width="2"/><rect x="92" y="290" width="284" height="12" rx="6" fill="#ff2442"/><text x="116" y="356" fill="#d91634" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">01</text><text x="116" y="412" fill="#1d2025" font-size="35" font-weight="900" font-family="Microsoft YaHei, sans-serif">同口径</text><text x="116" y="469" fill="#343943" font-size="23" font-family="Microsoft YaHei, sans-serif">分子分母对齐</text><text x="116" y="510" fill="#687077" font-size="20" font-family="Microsoft YaHei, sans-serif">次数与人数不混算</text><text x="380" y="445" fill="#ff2442" font-size="39" font-weight="900" font-family="Arial, sans-serif">→</text><rect x="402" y="290" width="284" height="274" rx="24" fill="#ffffff" stroke="#f1d4d8" stroke-width="2"/><rect x="402" y="290" width="284" height="12" rx="6" fill="#ff2442"/><text x="426" y="356" fill="#d91634" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">02</text><text x="426" y="412" fill="#1d2025" font-size="35" font-weight="900" font-family="Microsoft YaHei, sans-serif">样本量</text><text x="426" y="469" fill="#343943" font-size="23" font-family="Microsoft YaHei, sans-serif">先看事件够不够</text><text x="426" y="510" fill="#687077" font-size="20" font-family="Microsoft YaHei, sans-serif">少量支付逐单看</text><text x="690" y="445" fill="#ff2442" font-size="39" font-weight="900" font-family="Arial, sans-serif">→</text><rect x="712" y="290" width="284" height="274" rx="24" fill="#ffffff" stroke="#f1d4d8" stroke-width="2"/><rect x="712" y="290" width="284" height="12" rx="6" fill="#ff2442"/><text x="736" y="356" fill="#d91634" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">03</text><text x="736" y="412" fill="#1d2025" font-size="35" font-weight="900" font-family="Microsoft YaHei, sans-serif">案例线</text><text x="736" y="469" fill="#343943" font-size="23" font-family="Microsoft YaHei, sans-serif">只作教学参照</text><text x="736" y="510" fill="#687077" font-size="20" font-family="Microsoft YaHei, sans-serif">不是平台及格线</text><text x="1000" y="445" fill="#ff2442" font-size="39" font-weight="900" font-family="Arial, sans-serif">→</text><rect x="1022" y="290" width="284" height="274" rx="24" fill="#ffffff" stroke="#f1d4d8" stroke-width="2"/><rect x="1022" y="290" width="284" height="12" rx="6" fill="#ff2442"/><text x="1046" y="356" fill="#d91634" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">04</text><text x="1046" y="412" fill="#1d2025" font-size="35" font-weight="900" font-family="Microsoft YaHei, sans-serif">自家线</text><text x="1046" y="469" fill="#343943" font-size="23" font-family="Microsoft YaHei, sans-serif">近四期同任务比</text><text x="1046" y="510" fill="#687077" font-size="20" font-family="Microsoft YaHei, sans-serif">低查因·高拆解</text><rect x="92" y="622" width="1214" height="82" rx="18" fill="#ff2442"/><text x="700" y="672" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">低于参考值，列两种解释；高于参考值，继续查成交、退款与贡献</text></svg>