<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img"><rect width="1400" height="760" fill="#fffaf8"/><rect x="0" y="0" width="1400" height="12" fill="#ff2442"/><circle cx="1320" cy="76" r="115" fill="#fff0f2"/><circle cx="95" cy="696" r="130" fill="#fff0f2"/><text x="92" y="85" fill="#d91634" font-size="22" font-weight="800" font-family="Microsoft YaHei, sans-serif">马哥赢创 · 实战知识图</text><text x="92" y="166" fill="#1d2025" font-size="54" font-weight="900" font-family="Microsoft YaHei, sans-serif">漏斗哪一层掉，就先修哪一层</text><text x="94" y="217" fill="#687077" font-size="25" font-family="Microsoft YaHei, sans-serif">从“看到”到“真正用上”，每个数据都对应不同的经营动作</text><rect x="92" y="290" width="284" height="274" rx="24" fill="#ffffff" stroke="#f1d4d8" stroke-width="2"/><rect x="92" y="290" width="284" height="12" rx="6" fill="#ff2442"/><text x="116" y="356" fill="#d91634" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">01</text><text x="116" y="412" fill="#1d2025" font-size="35" font-weight="900" font-family="Microsoft YaHei, sans-serif">曝光 → 阅读</text><text x="116" y="469" fill="#343943" font-size="23" font-family="Microsoft YaHei, sans-serif">首图与标题</text><text x="116" y="510" fill="#687077" font-size="20" font-family="Microsoft YaHei, sans-serif">是否让目标人愿意点开</text><text x="380" y="445" fill="#ff2442" font-size="39" font-weight="900" font-family="Arial, sans-serif">→</text><rect x="402" y="290" width="284" height="274" rx="24" fill="#ffffff" stroke="#f1d4d8" stroke-width="2"/><rect x="402" y="290" width="284" height="12" rx="6" fill="#ff2442"/><text x="426" y="356" fill="#d91634" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">02</text><text x="426" y="412" fill="#1d2025" font-size="35" font-weight="900" font-family="Microsoft YaHei, sans-serif">阅读 → 点击</text><text x="426" y="469" fill="#343943" font-size="23" font-family="Microsoft YaHei, sans-serif">内容与商品</text><text x="426" y="510" fill="#687077" font-size="20" font-family="Microsoft YaHei, sans-serif">是不是同一个任务</text><text x="690" y="445" fill="#ff2442" font-size="39" font-weight="900" font-family="Arial, sans-serif">→</text><rect x="712" y="290" width="284" height="274" rx="24" fill="#ffffff" stroke="#f1d4d8" stroke-width="2"/><rect x="712" y="290" width="284" height="12" rx="6" fill="#ff2442"/><text x="736" y="356" fill="#d91634" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">03</text><text x="736" y="412" fill="#1d2025" font-size="35" font-weight="900" font-family="Microsoft YaHei, sans-serif">点击 → 支付</text><text x="736" y="469" fill="#343943" font-size="23" font-family="Microsoft YaHei, sans-serif">规格与详情</text><text x="736" y="510" fill="#687077" font-size="20" font-family="Microsoft YaHei, sans-serif">有没有说清所见所买</text><text x="1000" y="445" fill="#ff2442" font-size="39" font-weight="900" font-family="Arial, sans-serif">→</text><rect x="1022" y="290" width="284" height="274" rx="24" fill="#ffffff" stroke="#f1d4d8" stroke-width="2"/><rect x="1022" y="290" width="284" height="12" rx="6" fill="#ff2442"/><text x="1046" y="356" fill="#d91634" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">04</text><text x="1046" y="412" fill="#1d2025" font-size="35" font-weight="900" font-family="Microsoft YaHei, sans-serif">支付 → 使用</text><text x="1046" y="469" fill="#343943" font-size="23" font-family="Microsoft YaHei, sans-serif">发货与说明</text><text x="1046" y="510" fill="#687077" font-size="20" font-family="Microsoft YaHei, sans-serif">买家是否能完成任务</text><rect x="92" y="622" width="1214" height="82" rx="18" fill="#ff2442"/><text x="700" y="672" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">先核同一窗口、同一商品版本；一次只改一个主变量</text></svg>