<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img"><rect width="1400" height="760" fill="#fffaf8"/><rect x="0" y="0" width="1400" height="12" fill="#ff2442"/><circle cx="1320" cy="76" r="115" fill="#fff0f2"/><circle cx="95" cy="696" r="130" fill="#fff0f2"/><text x="92" y="85" fill="#d91634" font-size="22" font-weight="800" font-family="Microsoft YaHei, sans-serif">马哥赢创 · 实战知识图</text><text x="92" y="166" fill="#1d2025" font-size="54" font-weight="900" font-family="Microsoft YaHei, sans-serif">扩品先过三道门，再决定上新</text><text x="94" y="217" fill="#687077" font-size="25" font-family="Microsoft YaHei, sans-serif">围绕同一买家的连续任务扩，不把账号扩成无边界的杂货铺</text><rect x="92" y="290" width="284" height="274" rx="24" fill="#ffffff" stroke="#f1d4d8" stroke-width="2"/><rect x="92" y="290" width="284" height="12" rx="6" fill="#ff2442"/><text x="116" y="356" fill="#d91634" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">起点</text><text x="116" y="412" fill="#1d2025" font-size="35" font-weight="900" font-family="Microsoft YaHei, sans-serif">首款商品</text><text x="116" y="469" fill="#343943" font-size="23" font-family="Microsoft YaHei, sans-serif">真实成交与可用</text><text x="116" y="510" fill="#687077" font-size="20" font-family="Microsoft YaHei, sans-serif">先把第一次交付跑通</text><text x="380" y="445" fill="#ff2442" font-size="39" font-weight="900" font-family="Arial, sans-serif">→</text><rect x="402" y="290" width="284" height="274" rx="24" fill="#ffffff" stroke="#f1d4d8" stroke-width="2"/><rect x="402" y="290" width="284" height="12" rx="6" fill="#ff2442"/><text x="426" y="356" fill="#d91634" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">第一门</text><text x="426" y="412" fill="#1d2025" font-size="35" font-weight="900" font-family="Microsoft YaHei, sans-serif">同任务规格</text><text x="426" y="469" fill="#343943" font-size="23" font-family="Microsoft YaHei, sans-serif">版本、深度、载体</text><text x="426" y="510" fill="#687077" font-size="20" font-family="Microsoft YaHei, sans-serif">同一问题的不同选择</text><text x="690" y="445" fill="#ff2442" font-size="39" font-weight="900" font-family="Arial, sans-serif">→</text><rect x="712" y="290" width="284" height="274" rx="24" fill="#ffffff" stroke="#f1d4d8" stroke-width="2"/><rect x="712" y="290" width="284" height="12" rx="6" fill="#ff2442"/><text x="736" y="356" fill="#d91634" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">第二门</text><text x="736" y="412" fill="#1d2025" font-size="35" font-weight="900" font-family="Microsoft YaHei, sans-serif">相邻任务</text><text x="736" y="469" fill="#343943" font-size="23" font-family="Microsoft YaHei, sans-serif">买家下一步会问什么</text><text x="736" y="510" fill="#687077" font-size="20" font-family="Microsoft YaHei, sans-serif">重新采集付款证据</text><text x="1000" y="445" fill="#ff2442" font-size="39" font-weight="900" font-family="Arial, sans-serif">→</text><rect x="1022" y="290" width="284" height="274" rx="24" fill="#ffffff" stroke="#f1d4d8" stroke-width="2"/><rect x="1022" y="290" width="284" height="12" rx="6" fill="#ff2442"/><text x="1046" y="356" fill="#d91634" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">第三门</text><text x="1046" y="412" fill="#1d2025" font-size="35" font-weight="900" font-family="Microsoft YaHei, sans-serif">新的人群</text><text x="1046" y="469" fill="#343943" font-size="23" font-family="Microsoft YaHei, sans-serif">购买理由是否改变</text><text x="1046" y="510" fill="#687077" font-size="20" font-family="Microsoft YaHei, sans-serif">重新验证内容与服务</text><rect x="92" y="622" width="1214" height="82" rx="18" fill="#ff2442"/><text x="700" y="672" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">每款新品都要重写：谁付款、何时用、买完能完成什么</text></svg>