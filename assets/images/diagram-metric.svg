<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img"><rect width="1400" height="760" fill="#fffaf8"/><rect x="0" y="0" width="1400" height="12" fill="#ff2442"/><circle cx="1320" cy="76" r="115" fill="#fff0f2"/><circle cx="95" cy="696" r="130" fill="#fff0f2"/><text x="92" y="85" fill="#d91634" font-size="22" font-weight="800" font-family="Microsoft YaHei, sans-serif">马哥赢创 · 实战知识图</text><text x="92" y="166" fill="#1d2025" font-size="54" font-weight="900" font-family="Microsoft YaHei, sans-serif">看到一个转化率，先过四道门</text><text x="94" y="217" fill="#687077" font-size="25" font-family="Microsoft YaHei, sans-serif">每个百分比都要能还原成具体事件，才能指导下一步动作</text><rect x="92" y="290" width="284" height="274" rx="24" fill="#ffffff" stroke="#f1d4d8" stroke-width="2"/><rect x="92" y="290" width="284" height="12" rx="6" fill="#ff2442"/><text x="116" y="356" fill="#d91634" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">01</text><text x="116" y="412" fill="#1d2025" font-size="35" font-weight="900" font-family="Microsoft YaHei, sans-serif">分子</text><text x="116" y="469" fill="#343943" font-size="23" font-family="Microsoft YaHei, sans-serif">发生了几次？</text><text x="116" y="510" fill="#687077" font-size="20" font-family="Microsoft YaHei, sans-serif">支付订单还是点击次数</text><text x="380" y="445" fill="#ff2442" font-size="39" font-weight="900" font-family="Arial, sans-serif">→</text><rect x="402" y="290" width="284" height="274" rx="24" fill="#ffffff" stroke="#f1d4d8" stroke-width="2"/><rect x="402" y="290" width="284" height="12" rx="6" fill="#ff2442"/><text x="426" y="356" fill="#d91634" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">02</text><text x="426" y="412" fill="#1d2025" font-size="35" font-weight="900" font-family="Microsoft YaHei, sans-serif">分母</text><text x="426" y="469" fill="#343943" font-size="23" font-family="Microsoft YaHei, sans-serif">除以什么？</text><text x="426" y="510" fill="#687077" font-size="20" font-family="Microsoft YaHei, sans-serif">访客人数还是阅读次数</text><text x="690" y="445" fill="#ff2442" font-size="39" font-weight="900" font-family="Arial, sans-serif">→</text><rect x="712" y="290" width="284" height="274" rx="24" fill="#ffffff" stroke="#f1d4d8" stroke-width="2"/><rect x="712" y="290" width="284" height="12" rx="6" fill="#ff2442"/><text x="736" y="356" fill="#d91634" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">03</text><text x="736" y="412" fill="#1d2025" font-size="35" font-weight="900" font-family="Microsoft YaHei, sans-serif">窗口</text><text x="736" y="469" fill="#343943" font-size="23" font-family="Microsoft YaHei, sans-serif">是哪段时间？</text><text x="736" y="510" fill="#687077" font-size="20" font-family="Microsoft YaHei, sans-serif">同一 SKU 与流量来源</text><text x="1000" y="445" fill="#ff2442" font-size="39" font-weight="900" font-family="Arial, sans-serif">→</text><rect x="1022" y="290" width="284" height="274" rx="24" fill="#ffffff" stroke="#f1d4d8" stroke-width="2"/><rect x="1022" y="290" width="284" height="12" rx="6" fill="#ff2442"/><text x="1046" y="356" fill="#d91634" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">04</text><text x="1046" y="412" fill="#1d2025" font-size="35" font-weight="900" font-family="Microsoft YaHei, sans-serif">样本</text><text x="1046" y="469" fill="#343943" font-size="23" font-family="Microsoft YaHei, sans-serif">有多少事件？</text><text x="1046" y="510" fill="#687077" font-size="20" font-family="Microsoft YaHei, sans-serif">少量订单先逐单排查</text><rect x="92" y="622" width="1214" height="82" rx="18" fill="#ff2442"/><text x="700" y="672" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">80 次商品点击 ÷ 2,000 次阅读 = 4% · 只能说明这段衔接，不能证明利润</text></svg>